<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Spring Security</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Bienvenue sur l'application publique</h2>

    <p sec:authorize="isAuthenticated()">
        Connecté en tant que <strong sec:authentication="name"></strong>
        (rôles : <span sec:authentication="principal.authorities"></span>)
    </p>

    <p><a th:href="@{/user/dashboard}">Espace Utilisateur</a></p>
    <p><a th:href="@{/admin/dashboard}">Espace Administrateur</a></p>

    <p sec:authorize="isAnonymous()"><a th:href="@{/login}">Se connecter</a></p>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button type="submit">Se déconnecter</button>
    </form>
</div>
</body>
</html>
